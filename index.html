<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="sjpark의 QA 포트폴리오">
  <title>sjpark | QA Portfolio</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #0b1120; color: #edf3ff; line-height: 1.7; }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid #80e6ce; outline-offset: 4px; }
    .wrap { width: min(100% - 40px, 1040px); margin: auto; }
    header { border-bottom: 1px solid #243148; }
    nav { display: flex; align-items: center; justify-content: space-between; min-height: 76px; }
    .brand { font-weight: 800; letter-spacing: -.04em; text-decoration: none; }
    .brand span { color: #80e6ce; }
    .nav-link { color: #b9c7dc; font-size: .95rem; text-decoration: none; }
    .nav-link:hover { color: #80e6ce; }
    main { padding: clamp(72px, 13vw, 150px) 0 100px; }
    .eyebrow { margin: 0 0 20px; color: #80e6ce; font-size: .88rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(2.7rem, 8vw, 5.7rem); line-height: 1.12; letter-spacing: -.07em; }
    h1 span { color: #80e6ce; }
    .intro { max-width: 590px; margin: 30px 0 36px; color: #b9c7dc; font-size: clamp(1rem, 2vw, 1.18rem); }
    .button { display: inline-block; padding: 13px 20px; border: 1px solid #80e6ce; border-radius: 8px; background: #80e6ce; color: #0b1120; font-weight: 700; text-decoration: none; }
    .button:hover { background: #a3f2df; }
    section { margin-top: clamp(100px, 15vw, 170px); padding-top: 30px; border-top: 1px solid #243148; }
    section h2 { margin: 0 0 15px; font-size: 1.5rem; letter-spacing: -.04em; }
    section p { max-width: 630px; margin: 0; color: #b9c7dc; }
    footer { padding: 28px 0; border-top: 1px solid #243148; color: #8fa2bb; font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="주 메뉴">
      <a class="brand" href="#top">sjpark<span>.</span></a>
      <a class="nav-link" href="#about">소개</a>
    </nav>
  </header>
  <main class="wrap" id="top">
    <p class="eyebrow">QA Portfolio</p>
    <h1>더 나은 경험을 위한<br><span>품질의 기록.</span></h1>
    <p class="intro">안녕하세요, sjpark의 QA 포트폴리오입니다. 프로젝트와 테스트 경험을 이곳에 정리하고 있습니다.</p>
    <a class="button" href="https://github.com/sjpark00">GitHub 프로필 보기 ↗</a>
    <section id="about" aria-labelledby="about-title">
      <h2 id="about-title">포트폴리오 준비 중</h2>
      <p>진행한 프로젝트와 QA 활동을 정리해 순차적으로 추가할 예정입니다.</p>
    </section>
  </main>
  <footer><div class="wrap">© sjpark · QA Portfolio</div></footer>
</body>
</html>
